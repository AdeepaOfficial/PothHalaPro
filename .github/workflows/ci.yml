name: PothHalaPro CI

on:
  push:
    branches:
      - main
      - develop
      - 'developer/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    name: Build & Asset Integrity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java Server Compilation
        run: |
          mkdir -p bin
          javac -d bin src/server/PothHalaServer.java
          echo "Java backend compiled successfully into bin/"

      - name: Verify Core Web Assets & Structure
        run: |
          required_files=(
            "public/index.html"
            "public/manifest.json"
            "public/sw.js"
            "public/css/style.css"
            "public/css/print.css"
            "public/js/app.js"
            "public/js/license.js"
            "public/js/nic-cloner.js"
            "public/js/sticker-studio.js"
            "public/js/counter-tools.js"
            "public/js/education-hub.js"
            "run.bat"
            "start_offline.bat"
            "README.md"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing!"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "Error: File $file is empty!"
              exit 1
            fi
            echo "Verified: $file"
          done

      - name: Validate JavaScript Syntax
        run: |
          node -c public/js/app.js
          node -c public/js/license.js
          node -c public/js/nic-cloner.js
          node -c public/js/sticker-studio.js
          node -c public/js/counter-tools.js
          node -c public/js/education-hub.js
          node -c public/sw.js
          echo "All JavaScript modules passed syntax validation."

      - name: Verify Vector Cartoons & Samples
        run: |
          cartoons=(
            "astronaut.svg"
            "dinosaur.svg"
            "lion_mascot.svg"
            "princess.svg"
            "racing_car.svg"
            "robot.svg"
            "scholar.svg"
            "superhero.svg"
          )
          
          for c in "${cartoons[@]}"; do
            if [ ! -f "public/assets/cartoons/$c" ]; then
              echo "Error: Cartoon public/assets/cartoons/$c missing!"
              exit 1
            fi
          done
          echo "All vector cartoon assets verified."
