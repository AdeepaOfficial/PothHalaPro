  <text x="60" y="106" font-size="16" font-family="'Impact', Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <!-- Gold Medal Ribbon -->
  <path d="M48 70 L60 90 L72 70" fill="none" stroke="#DC2626" stroke-width="3"/>
