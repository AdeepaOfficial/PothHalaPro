  <circle cx="60" cy="92" r="8" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="60" cy="92" r="6" fill="#FACC15"/>
  <polygon points="60,88 61.5,91 65,91 62,93 63.5,96 60,94 56.5,96 58,93 55,91 58.5,91" fill="#D97706"/>
