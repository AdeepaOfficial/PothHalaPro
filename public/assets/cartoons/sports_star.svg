  <circle cx="68" cy="52" r="2.5" fill="#1E293B"/>
  <circle cx="69" cy="51" r="0.8" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="46" cy="57" r="2.5" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="74" cy="57" r="2.5" fill="#FCA5A5" opacity="0.6"/>
