  <text x="140" y="150" font-family="'Segoe UI', Arial" font-size="14" fill="#64748B">Motorcycles</text>
  <text x="240" y="150" font-family="'Segoe UI', Arial" font-size="14" fill="#0F172A">2019.06.20</text>
